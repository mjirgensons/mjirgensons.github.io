<div class="btn-row">
  <a class="btn btn-buy" href="{{ book.formats[0].url }}" rel="noopener">Buy on Amazon · Kindle ${{ book.formats[0].price }}</a>
  <a class="btn btn-line" href="{{ book.free_sample }}">Read Chapter 1 free</a>
</div>
<p class="markets">Also paperback ${{ book.formats[1].price }} · hardcover ${{ book.formats[2].price }} · <a href="{{ book.formats[3].url }}" rel="noopener">PDF ${{ book.formats[3].price | replace('.00','') }}</a> · <a href="https://www.amazon.ca/dp/{{ book.formats[0].asin }}" rel="noopener">Amazon.ca</a></p>
